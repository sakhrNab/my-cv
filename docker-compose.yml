# Coolify Docker Compose Configuration
# Note: Coolify handles port mapping automatically - don't specify ports
# Environment variables are set in Coolify UI and injected at runtime

services:
  cv-app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

